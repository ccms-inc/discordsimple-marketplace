# NGINX additional directives for discordsimple-mcp.ccmssolutions.com
# Paste these into Plesk → Apache & nginx Settings →
# "Additional nginx directives" for the MCP endpoint subdomain.
# (Only needed when Apache proxy mode is OFF / nginx-only.)

# Route all requests through index.php (MCP endpoint).
location / {
    try_files $uri /index.php$is_args$args;
}

# Pass the Authorization: Bearer header to PHP-FPM.
# Required for MCP connector key validation.
fastcgi_param HTTP_AUTHORIZATION $http_authorization;

# Never serve dotfiles (.env, .git, .htaccess, etc.).
location ~ /\. { deny all; }
