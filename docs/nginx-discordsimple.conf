# NGINX additional directives for discordsimple.ccmshightech.com
# Paste these into Plesk → Apache & nginx Settings →
# "Additional nginx directives" for the account portal subdomain.
# (Only needed when Apache proxy mode is OFF / nginx-only.)

# Ensure index.php is the default document.
index index.php;

# Never serve dotfiles (.env, .git, .htaccess, etc.).
location ~ /\. { deny all; }
